<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giocate</title>
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giocate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f4f3ef;--card:#ffffff;--ink:#1c1b19;--muted:#77736b;--line:#e6e3dc;
  --pos:#1f8a4c;--pos-bg:#e3f3e9;--neg:#c8372d;--neg-bg:#fbe7e4;--acc:#2b2a6b;--acc-ink:#fff;--chip:#ebe9e3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212;--card:#1d1d1c;--ink:#f1efe9;--muted:#9c978d;--line:#2d2c2a;
  --pos:#4cc47f;--pos-bg:#16301f;--neg:#ff6b5e;--neg-bg:#3a1a17;--acc:#a9a6ff;--acc-ink:#15143a;--chip:#2a2927;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(100px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.year{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:999px;padding:2px}
.year button{border:0;background:none;color:var(--ink);font-size:18px;font-weight:700;width:30px;height:30px;border-radius:50%;cursor:pointer}
.year button:disabled{opacity:.3}
.year span{font-weight:800;font-size:15px;min-width:42px;text-align:center}
.icon-btn{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--chip);color:var(--ink);font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--acc);color:var(--acc-ink)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.big .v{font-size:30px}
.badge{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap}
.badge.pos{background:var(--pos-bg);color:var(--pos)}.badge.neg{background:var(--neg-bg);color:var(--neg)}.badge.zero{background:var(--chip);color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;overflow-x:auto;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;padding:14px 14px 4px}
.sub{font-size:12px;color:var(--muted);padding:0 14px 10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toggle{font-weight:600;font-size:13px;background:none;border:0;color:var(--acc);cursor:pointer}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{white-space:nowrap;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}
td{white-space:nowrap;font-size:14px;text-align:right;padding:11px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:12px}
th:last-child,td:last-child{padding-right:12px}
@media (max-width:420px){td{font-size:12.5px;padding:11px 3px}th{padding:10px 3px;letter-spacing:0;font-size:9.5px}th:first-child,td:first-child{padding-left:10px}th:last-child,td:last-child{padding-right:10px}.mname{display:none}}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tr.empty td{color:var(--muted)}
tr.today td:first-child{font-weight:800;color:var(--acc)}
tfoot td{font-weight:800;border-top:2px solid var(--line);background:color-mix(in srgb,var(--chip) 45%,transparent)}
.dname{font-size:11px;color:var(--muted);margin-left:4px}
.fab{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;padding:15px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);cursor:pointer;z-index:5}
.chart{padding:4px 8px 12px}
.chart svg{width:100%;height:auto;display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.field input{width:100%;font-weight:700;font-size:20px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
.field input:focus{border-color:var(--acc)}
.prev{display:flex;justify-content:space-between;font-size:14px;padding:10px 2px 14px;color:var(--muted)}
.prev b{font-size:16px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink);text-align:center}
.btn.main{background:var(--acc);color:var(--acc-ink)}
.btn.del{flex:0 0 auto;background:var(--neg-bg);color:var(--neg);padding:14px 16px}
.menu .btn{display:block;width:100%;margin-bottom:10px;text-align:left;padding:15px 16px}
.menu p{font-size:13px;color:var(--muted);line-height:1.45;margin:4px 2px 14px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
.banner{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.45}
.banner b{display:block;margin-bottom:6px}
.banner .btn{margin-top:10px;display:block;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎰 Giocate</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="year"><button id="yPrev" aria-label="Anno precedente">‹</button><span id="yLbl"></span><button id="yNext" aria-label="Anno successivo">›</button></div>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">⋯</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<button class="fab" id="fab">＋ Inserisci giocata</button>

<div class="sheet-bg" id="sheetBg">
  <form class="sheet" id="sheet" autocomplete="off">
    <h3 id="sheetTitle"></h3>
    <div class="field" id="dateField"><label for="fDate">Giorno</label><input type="date" id="fDate"></div>
    <div class="field"><label for="fP">Puntata (€)</label><input id="fP" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label for="fV">Vincita (€)</label><input id="fV" inputmode="decimal" placeholder="0,00"></div>
    <div class="field"><label for="fR">Ricarica (€)</label><input id="fR" inputmode="decimal" placeholder="0,00"></div>
    <div class="prev"><span>Bilancio del giorno</span><b id="fBal">—</b></div>
    <div class="btns">
      <button type="button" class="btn del" id="bDel">Svuota</button>
      <button type="button" class="btn" id="bCancel">Annulla</button>
      <button type="submit" class="btn main">Salva</button>
    </div>
  </form>
</div>

<div class="sheet-bg" id="menuBg">
  <div class="sheet menu">
    <h3>Backup e dati</h3>
    <p>Le giocate sono salvate solo su questo telefono. Ogni tanto fai un backup e tienilo in un posto sicuro, ad esempio su File o Drive: se cambi telefono o cancelli i dati del browser, ti serve per recuperarle.</p>
    <button class="btn main" id="mExport">⬇︎ Salva backup</button>
    <label class="btn" for="mFile">⬆︎ Carica backup o file Excel</label>
    <input type="file" id="mFile" accept=".json,.xlsx,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <p id="mInfo"></p>
    <button class="btn" id="mClose">Chiudi</button>
  </div>
</div>

<div class="sheet-bg" id="askBg">
  <div class="sheet menu">
    <h3 id="askTitle"></h3>
    <p id="askText"></p>
    <div class="btns"><button class="btn" id="askNo">Annulla</button><button class="btn main" id="askYes">Conferma</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const KEY='giocate-dati-v1';
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG=['dom','lun','mar','mer','gio','ven','sab'];
const SLUG=MESI.map(m=>m.toLowerCase());
const $=id=>document.getElementById(id);

// ---------- dati (salvati sul telefono)
let E={};
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);E=o.entries||{}}}catch(e){}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,saved:new Date().toISOString(),entries:E}));return true}
  catch(e){toast('⚠️ Non riesco a salvare sul telefono');return false}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const now=new Date();
let Y=now.getFullYear();
let cur=now.getMonth();
let showAll=false;

const r2=x=>Math.round(x*100)/100;
const fmt=x=>Math.abs(x).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=x=>(x<0?'−':'')+'€ '+fmt(x);
const nn=x=>(x<0?'−':'')+fmt(x);
const sn=x=>(x>0?'+':'')+nn(x);
const sgn=x=>(x>0?'+':'')+eur(x);
const cls=x=>x>0?'pos':x<0?'neg':'';
const stato=x=>x>0?'<span class="badge pos">✅ ATTIVO</span>':x<0?'<span class="badge neg">❌ PASSIVO</span>':'<span class="badge zero">—</span>';
const key=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const has=e=>e&&(e.p!=null||e.v!=null);
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());

function years(){const s=new Set(Object.keys(E).map(k=>+k.slice(0,4)));s.add(now.getFullYear());return [...s].sort()}
function monthTot(y,m){let p=0,v=0,r=0,n=0;const pre=key(y,m,1).slice(0,8);
  for(const k in E){if(!k.startsWith(pre))continue;const e=E[k];p+=e.p||0;v+=e.v||0;r+=e.r||0;if(has(e))n++}
  p=r2(p);v=r2(v);r=r2(r);return{p,v,r,n,b:r2(v-p)}}

// ---------- navigazione
function readHash(){const h=(location.hash||'').slice(1);const m=h.match(/^(\d{4})(?:-([a-z]+))?$/);
  if(m){Y=+m[1];cur=m[2]==null||m[2]==='riepilogo'?-1:Math.max(0,SLUG.indexOf(m[2]))}}
function writeHash(){const h='#'+Y+'-'+(cur===-1?'riepilogo':SLUG[cur]);if(location.hash!==h)history.replaceState(null,'',h)}
readHash();

function renderHeader(){const ys=years();$('yLbl').textContent=Y;$('yPrev').disabled=Y<=Math.min(...ys);$('yNext').disabled=Y>=Math.max(...ys,now.getFullYear())}
$('yPrev').onclick=()=>{Y--;render()};
$('yNext').onclick=()=>{Y++;render()};

function renderTabs(){
  let h=`<button class="tab ${cur===-1?'on':''}" data-m="-1">📊 Riepilogo</button>`;
  MESI.forEach((m,i)=>{const t=monthTot(Y,i);const c=t.p||t.v||t.r?(t.b>0?'var(--pos)':t.b<0?'var(--neg)':'var(--muted)'):null;
    h+=`<button class="tab ${cur===i?'on':''}" data-m="${i}">${m}${c?`<span class="dot" style="background:${c}"></span>`:''}</button>`});
  $('tabs').innerHTML=h;
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=+b.dataset.m;render(true)});
  const on=$('tabs').querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function kpis(t,label){return `<div class="grid">
  <div class="kpi big"><div><div class="l">Bilancio ${label}</div><div class="v ${cls(t.b)}">${eur(t.b)}</div></div>${stato(t.b)}</div>
  <div class="kpi"><div class="l">Puntato</div><div class="v">${eur(t.p)}</div></div>
  <div class="kpi"><div class="l">Vincite</div><div class="v">${eur(t.v)}</div></div>
  <div class="kpi"><div class="l">Ricariche</div><div class="v">${eur(t.r)}</div></div>
  <div class="kpi"><div class="l">Giorni giocati</div><div class="v">${t.n}</div></div></div>`}

function renderMonth(m){
  const t=monthTot(Y,m);let rows='';
  for(let d=1;d<=dim(Y,m);d++){const k=key(Y,m,d),e=E[k]||{};const any=e.p!=null||e.v!=null||e.r!=null;
    if(!showAll&&!any&&k!==todayKey)continue;
    const b=has(e)?r2((e.v||0)-(e.p||0)):null;
    rows+=`<tr data-k="${k}" class="${any?'':'empty'} ${k===todayKey?'today':''}"><td>${d}<span class="dname">${GG[new Date(Y,m,d).getDay()]}</span></td>
      <td>${e.p!=null?nn(e.p):''}</td><td>${e.v!=null?nn(e.v):''}</td><td>${e.r!=null?nn(e.r):''}</td>
      <td class="${b==null?'':cls(b)}">${b==null?'':sn(b)}</td></tr>`}
  if(!rows)rows=`<tr class="empty"><td colspan="5" style="text-align:center;padding:24px">Nessuna giocata. Tocca “Inserisci giocata”.</td></tr>`;
  $('view').innerHTML=kpis(t,MESI[m].toLowerCase())+`<div class="card">
   <div class="toolbar"><b>🎰 ${MESI[m]} ${Y}</b><button class="toggle" id="tg">${showAll?'Solo giorni giocati':'Mostra tutti i giorni'}</button></div>
   <table><thead><tr><th>Giorno</th><th>Puntata €</th><th>Vincita €</th><th>Ricarica €</th><th>Bilancio €</th></tr></thead><tbody>${rows}</tbody>
   <tfoot><tr><td>TOTALE</td><td>${nn(t.p)}</td><td>${nn(t.v)}</td><td>${nn(t.r)}</td><td class="${cls(t.b)}">${sn(t.b)}</td></tr></tfoot></table></div>
   <p class="note">Bilancio = vincite − puntate · Le ricariche sono registrate a parte</p>`;
  $('tg').onclick=()=>{showAll=!showAll;renderMonth(m)};
  $('view').querySelectorAll('tbody tr[data-k]').forEach(tr=>tr.onclick=()=>openSheet(tr.dataset.k,false));
}
function chart(ts){
  const W=680,H=200,pl=44,pb=24,pt=12;const vals=ts.map(t=>t.b);
  const hi=Math.max(...vals,0),lo=Math.min(...vals,0),span=(hi-lo)||1;
  const yv=v=>pt+(hi-v)/span*(H-pt-pb);const bw=(W-pl)/12;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bilancio per mese">`;
  s+=`<line x1="${pl}" x2="${W}" y1="${yv(0)}" y2="${yv(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  [hi,lo].forEach(v=>{if(v)s+=`<text x="${pl-6}" y="${yv(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}€</text>`});
  ts.forEach((t,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64,y0=yv(0),y1=yv(t.b);
    if(t.b)s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1.5,Math.abs(y1-y0))}" rx="3" fill="${t.b>0?'var(--pos)':'var(--neg)'}"/>`;
    s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESI[i].slice(0,3)}</text>`});
  return s+'</svg>'}
function renderSummary(){
  const ts=MESI.map((_,i)=>monthTot(Y,i));
  const T={p:0,v:0,r:0,n:0};ts.forEach(t=>{T.p+=t.p;T.v+=t.v;T.r+=t.r;T.n+=t.n});
  T.p=r2(T.p);T.v=r2(T.v);T.r=r2(T.r);T.b=r2(T.v-T.p);
  const att=ts.filter(t=>t.b>0).length,pas=ts.filter(t=>t.b<0).length;
  const rows=ts.map((t,i)=>`<tr data-m="${i}"><td>${MESI[i].slice(0,3)}<span class="mname">${MESI[i].slice(3)}</span></td><td>${nn(t.p)}</td><td>${nn(t.v)}</td><td>${nn(t.r)}</td><td class="${cls(t.b)}">${sn(t.b)}</td></tr>`).join('');
  $('view').innerHTML=kpis(T,'anno')+`<div class="card"><h2>Bilancio mese per mese</h2><div class="sub">${att} mesi attivi · ${pas} passivi</div><div class="chart">${chart(ts)}</div></div>
  <div class="card"><div class="toolbar"><b>📊 Riepilogo annuale ${Y}</b></div>
  <table><thead><tr><th>Mese</th><th>Puntato €</th><th>Vincite €</th><th>Ricariche €</th><th>Bilancio €</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td>TOTALE</td><td>${nn(T.p)}</td><td>${nn(T.v)}</td><td>${nn(T.r)}</td><td class="${cls(T.b)}">${sn(T.b)}</td></tr></tfoot></table></div>
  <p class="note">Tocca un mese per aprirlo</p>`;
  $('view').querySelectorAll('tbody tr[data-m]').forEach(tr=>tr.onclick=()=>{cur=+tr.dataset.m;render(true)});
}
function renderBanner(){
  $('banner').innerHTML=Object.keys(E).length?'':`<div class="banner"><b>Benvenuto! 👋</b>Per ritrovare le giocate che hai già, carica il tuo file Excel o un backup. Oppure inizia subito a inserire.<label class="btn main" for="mFile">⬆︎ Carica file Excel o backup</label></div>`}
function render(top){renderHeader();renderBanner();renderTabs();cur===-1?renderSummary():renderMonth(cur);writeHash();if(top)window.scrollTo(0,0)}

// ---------- inserimento
let editKey=null;
const num=s=>{s=(s||'').trim().replace(/\s|€/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)&&n>=0?r2(n):NaN};
const fmtIn=n=>n==null?'':String(n).replace('.',',');
function fill(k){const e=E[k]||{};$('fP').value=fmtIn(e.p);$('fV').value=fmtIn(e.v);$('fR').value=fmtIn(e.r);upd()}
function upd(){const p=num($('fP').value),v=num($('fV').value);const el=$('fBal');
  if((p==null&&v==null)||Number.isNaN(p)||Number.isNaN(v)){el.textContent='—';el.className='';return}
  const b=r2((v||0)-(p||0));el.textContent=sgn(b);el.className=cls(b)}
function openSheet(k,pick){editKey=k;const d=new Date(k+'T12:00');
  $('sheetTitle').textContent=pick?'Nuova giocata':d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('dateField').style.display=pick?'':'none';$('fDate').value=k;fill(k);$('sheetBg').classList.add('on')}
function closeSheet(){$('sheetBg').classList.remove('on');document.activeElement&&document.activeElement.blur()}
['fP','fV','fR'].forEach(id=>$(id).oninput=upd);
$('fDate').onchange=()=>{const k=$('fDate').value;if(/^\d{4}-\d{2}-\d{2}$/.test(k)){editKey=k;fill(k)}};
$('bCancel').onclick=closeSheet;
$('sheetBg').onclick=e=>{if(e.target===$('sheetBg'))closeSheet()};
$('bDel').onclick=()=>{delete E[editKey];closeSheet();afterSave(editKey,'Giorno svuotato')};
$('sheet').onsubmit=e=>{e.preventDefault();const p=num($('fP').value),v=num($('fV').value),r=num($('fR').value);
  if([p,v,r].some(Number.isNaN)){$('fBal').textContent='Importo non valido';$('fBal').className='neg';return}
  const o={};if(p!=null)o.p=p;if(v!=null)o.v=v;if(r!=null)o.r=r;
  if(Object.keys(o).length)E[editKey]=o;else delete E[editKey];
  closeSheet();afterSave(editKey,'✓ Salvato')};
function afterSave(k,msg){if(persist())toast(msg);Y=+k.slice(0,4);cur=+k.slice(5,7)-1;render()}
$('fab').onclick=()=>{const k=(cur>=0&&(Y!==now.getFullYear()||cur!==now.getMonth()))?key(Y,cur,1):todayKey;openSheet(k,true)};

// ---------- conferme e avvisi
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
function ask(title,text,yes){$('askTitle').textContent=title;$('askText').textContent=text;$('askBg').classList.add('on');
  $('askYes').onclick=()=>{$('askBg').classList.remove('on');yes()};$('askNo').onclick=()=>$('askBg').classList.remove('on')}

// ---------- backup
function menuInfo(){const n=Object.keys(E).length;let last='';try{last=JSON.parse(localStorage.getItem(KEY)||'{}').saved||''}catch(e){}
  $('mInfo').textContent=n?`${n} giorni registrati in totale.`:'Nessuna giocata registrata.'}
$('menuBtn').onclick=()=>{menuInfo();$('menuBg').classList.add('on')};
$('mClose').onclick=()=>$('menuBg').classList.remove('on');
$('menuBg').onclick=e=>{if(e.target===$('menuBg'))$('menuBg').classList.remove('on')};
$('mExport').onclick=async()=>{
  const sorted={};Object.keys(E).sort().forEach(k=>sorted[k]=E[k]);
  const txt=JSON.stringify({app:'giocate',v:1,exported:new Date().toISOString(),entries:sorted},null,1);
  const name='giocate-backup-'+todayKey+'.json';
  const file=new File([txt],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup giocate'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup scaricato')};

$('mFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=/\.xlsx$/i.test(f.name)?await readXlsx(f):readJson(await f.text());
    const n=Object.keys(data).length;if(!n){toast('Nessuna giocata trovata nel file');return}
    const clash=Object.keys(data).filter(k=>E[k]).length;
    ask('Caricare '+n+' giorni?',clash?`${clash} giorni sono già nell'app: verranno sostituiti con quelli del file. Gli altri giorni restano come sono.`:'Le giocate del file vengono aggiunte a quelle già presenti.',()=>{
      Object.assign(E,data);if(persist())toast('✓ Caricati '+n+' giorni');$('menuBg').classList.remove('on');
      const ks=Object.keys(data).sort();Y=+ks[ks.length-1].slice(0,4);cur=-1;render(true)})}
  catch(err){toast('⚠️ File non leggibile');console.error(err)}};

function clean(o){const r={};['p','v','r'].forEach(k=>{const x=o[k];if(x!=null&&x!==''&&isFinite(+x)&&+x>=0)r[k]=r2(+x)});return Object.keys(r).length?r:null}
function readJson(t){const o=JSON.parse(t);const src=o.entries||o;const out={};
  for(const k in src){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){const c=clean(src[k]);if(c)out[k]=c}}return out}

// Excel: legge i fogli mensili (Giorno | Puntata | Vincita | Ricarica)
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function readXlsx(f){
  if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const out={};
  wb.SheetNames.forEach(name=>{const m=SLUG.indexOf(name.trim().toLowerCase());if(m<0)return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true});
    let y=null;for(const r of rows.slice(0,3)){const mm=String(r[0]||'').match(/(20\d\d)/);if(mm){y=+mm[1];break}}
    const yy=/riepilogo\s*(20\d\d)/i.exec(wb.SheetNames.join(' '));if(yy)y=+yy[1];
    if(!y)y=now.getFullYear();
    rows.forEach(r=>{const d=r[0];if(typeof d!=='number'||d<1||d>31||d>dim(y,m))return;
      const c=clean({p:num1(r[1]),v:num1(r[2]),r:num1(r[3])});if(c)out[key(y,m,d)]=c})});
  return out}
function num1(x){if(x==null||x==='')return null;if(typeof x==='number')return x;const n=num(String(x));return Number.isNaN(n)?null:n}

window.addEventListener('hashchange',()=>{readHash();render(true)});
render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
